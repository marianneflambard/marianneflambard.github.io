<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Test : le chemin</title>
<style>
  :root { --nuit: #0e0a14; --texte: #f3e9d6; --doux: #b6a7a0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--nuit); color: var(--texte); font-family: Georgia, serif; }
  canvas#scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100lvh; display: block; }
  /* La hauteur de la page donne la longueur du chemin : on avance en faisant défiler. */
  #piste { height: 1400vh; }
  #aide { position: fixed; left: 0; right: 0; bottom: 8vh; text-align: center; color: var(--doux); font-size: 1rem; transition: opacity 1.2s; pointer-events: none; padding: 0 16px; }
  #etape { position: fixed; top: 12px; left: 12px; font: 13px monospace; color: var(--doux); opacity: .6; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="etape"></div>
<div id="aide">Fais défiler pour suivre la lumière.</div>
<div id="piste"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const S = THREE.MathUtils.smoothstep;
  const canvas = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 120);

  function canvasTex(w, h, draw) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h); return new THREE.CanvasTexture(c);
  }
  const dotTex = canvasTex(64, 64, (g, w) => {
    const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(0.4, "rgba(255,255,255,.6)"); r.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = r; g.fillRect(0, 0, w, w);
  });
  const bunnyTex = canvasTex(128, 160, (g) => {
    g.fillStyle = "#fffaf0";
    g.beginPath(); g.ellipse(48, 38, 11, 34, -0.15, 0, 7); g.fill();
    g.beginPath(); g.ellipse(80, 38, 11, 34, 0.15, 0, 7); g.fill();
    g.beginPath(); g.ellipse(64, 92, 34, 30, 0, 0, 7); g.fill();
    g.beginPath(); g.ellipse(64, 130, 40, 26, 0, 0, 7); g.fill();
    g.fillStyle = "#3a2a24"; g.beginPath(); g.arc(52, 90, 4, 0, 7); g.arc(76, 90, 4, 0, 7); g.fill();
    g.fillStyle = "#f2a0ae"; g.beginPath(); g.ellipse(48, 38, 5, 24, -0.15, 0, 7); g.ellipse(80, 38, 5, 24, 0.15, 0, 7); g.fill();
  });
  const girlTex = canvasTex(128, 160, (g) => {
    g.save(); g.translate(64, 150); g.rotate(-0.28);
    g.fillStyle = "#fffaf0";
    g.beginPath(); g.moveTo(-26, 0); g.quadraticCurveTo(-20, -70, -8, -92); g.lineTo(10, -92); g.quadraticCurveTo(24, -70, 28, 0); g.closePath(); g.fill();
    g.beginPath(); g.arc(2, -110, 20, 0, 7); g.fill();
    g.fillStyle = "#3a2a24"; g.beginPath(); g.arc(2, -116, 21, Math.PI, 0); g.fill();
    g.restore();
  });
  const add = (o) => { scene.add(o); return o; };
  const glowSprite = (color) => new THREE.Sprite(new THREE.SpriteMaterial({ map: dotTex, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));

  const hemi = add(new THREE.HemisphereLight(0xfff3d6, 0x8a6a78, 0.9));
  const lamp = add(new THREE.PointLight(0xffd27a, 1.1, 16));
  const stone = new THREE.MeshLambertMaterial({ color: 0xf0e2c4 });

  // Le terrier : des anneaux pastel, très sombres
  const RINGS = 60, PER = 40, R = 1.9, N = RINGS * PER;
  const tpos = new Float32Array(N * 3), tcol = new Float32Array(N * 3), tbase = new Float32Array(N * 3);
  const pastels = [0xf6d98f, 0xf4a7b4, 0xc9b8ee, 0xfff1c9]; const c = new THREE.Color();
  for (let r = 0, p = 0; r < RINGS; r++) {
    c.set(pastels[r % 4]);
    for (let k = 0; k < PER; k++, p++) {
      const a = (k / PER) * Math.PI * 2 + r * 0.21;
      tbase[p * 3] = Math.cos(a); tbase[p * 3 + 1] = Math.sin(a); tbase[p * 3 + 2] = -(r / RINGS) * 12;
      tcol[p * 3] = c.r; tcol[p * 3 + 1] = c.g; tcol[p * 3 + 2] = c.b;
    }
  }
  const tgeo = new THREE.BufferGeometry();
  tgeo.setAttribute("position", new THREE.BufferAttribute(tpos, 3));
  tgeo.setAttribute("color", new THREE.BufferAttribute(tcol, 3));
  const tmat = new THREE.PointsMaterial({ size: 0.1, map: dotTex, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  add(new THREE.Points(tgeo, tmat));

  // Les objets en vrac qui remontent (dessins provisoires, remplacés plus tard par ses modèles 3D)
  const objTex = [
    canvasTex(64, 64, (x) => { x.fillStyle = "#d9a35a"; x.beginPath(); x.moveTo(10, 58); x.lineTo(10, 26); x.arc(32, 24, 22, Math.PI, 0); x.lineTo(54, 58); x.closePath(); x.fill(); x.fillStyle = "#fff2cf"; x.beginPath(); x.moveTo(15, 54); x.lineTo(15, 27); x.arc(32, 25, 17, Math.PI, 0); x.lineTo(49, 54); x.closePath(); x.fill(); }),
    canvasTex(64, 64, (x) => { x.fillStyle = "#e0687c"; x.beginPath(); x.ellipse(22, 48, 10, 8, -0.4, 0, 7); x.fill(); x.fillRect(29, 10, 5, 38); x.fillRect(29, 10, 20, 6); }),
    canvasTex(64, 64, (x) => { x.strokeStyle = "#c9b8ee"; x.lineWidth = 4; x.beginPath(); for (let a = 0; a < 16; a += 0.2) { const r = a * 1.6; x.lineTo(32 + Math.cos(a) * r, 32 + Math.sin(a) * r); } x.stroke(); }),
    canvasTex(64, 64, (x) => { x.fillStyle = "#fff6dc"; x.fillRect(12, 8, 40, 48); x.fillStyle = "#8a6a78"; for (let l = 0; l < 5; l++) x.fillRect(17, 16 + l * 8, 30 - (l % 2) * 10, 3); }),
    canvasTex(64, 64, (x) => { x.fillStyle = "#f6d98f"; x.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? 11 : 26, a = k * Math.PI / 5 - Math.PI / 2; x.lineTo(32 + Math.cos(a) * r, 32 + Math.sin(a) * r); } x.fill(); })
  ];
  const objs = [];
  for (let i = 0; i < 34; i++) {
    const sp = add(new THREE.Sprite(new THREE.SpriteMaterial({ map: objTex[i % objTex.length], transparent: true, depthWrite: false })));
    const a = Math.random() * Math.PI * 2, r = 0.5 + Math.random() * 1.1, s = 0.25 + Math.random() * 0.3;
    sp.scale.set(s, s, 1); sp.userData = { x: Math.cos(a) * r, z: -1 - i * 0.34, off: Math.random() * 4, v: 0.5 + Math.random() * 0.9, rot: (Math.random() - 0.5) * 2 };
    objs.push(sp);
  }

  // Le parvis et le château
  const ground = add(new THREE.Mesh(new THREE.PlaneGeometry(30, 14), new THREE.MeshLambertMaterial({ color: 0xd9c19a })));
  ground.rotation.x = -Math.PI / 2; ground.position.set(0, -1.6, -17);
  const wallMat = new THREE.MeshLambertMaterial({ color: 0xeedcbc });
  const box = (w, h, d, x, y, z, m) => { const b = add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m || wallMat)); b.position.set(x, y, z); return b; };
  box(4.9, 9, 0.8, -3.55, 2.9, -20); box(4.9, 9, 0.8, 3.55, 2.9, -20); box(2.2, 4.5, 0.8, 0, 5.15, -20);
  add(new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.16, 8, 24, Math.PI), stone)).position.set(0, 1.8, -19.55);
  [-6.4, 6.4].forEach((x) => {
    add(new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.2, 11, 16), wallMat)).position.set(x, 3.9, -20);
    add(new THREE.Mesh(new THREE.ConeGeometry(1.4, 2.6, 16), new THREE.MeshLambertMaterial({ color: 0xe48a98 }))).position.set(x, 10.7, -20);
  });
  const colG = new THREE.CylinderGeometry(0.16, 0.2, 3.4, 12);
  for (let i = 0; i < 3; i++) [-2.6, 2.6].forEach((x) => add(new THREE.Mesh(colG, stone)).position.set(x, 0.1, -13.5 - i * 2));

  const doorMat = new THREE.MeshLambertMaterial({ color: 0xb9774f });
  const hinges = [-1.1, 1.1].map((x) => {
    const h = add(new THREE.Group()); h.position.set(x, -1.6, -19.6);
    const panel = new THREE.Mesh(new THREE.BoxGeometry(1.1, 3.4, 0.1), doorMat);
    panel.position.set(x < 0 ? 0.55 : -0.55, 1.7, 0); h.add(panel); return h;
  });
  const doorGlow = add(glowSprite(0xffe08a)); doorGlow.position.set(0, 0, -19.3);

  // La montée vers les cieux
  for (let i = 0; i < 11; i++) {
    const z = -22 - i * 3, y = -1.6 + i * 0.65;
    box(3.6, 0.65, 3, 0, y + 0.325, z, new THREE.MeshLambertMaterial({ color: 0xe3cfa8 }));
    [-1.8, 1.8].forEach((x) => add(new THREE.Mesh(colG, stone)).position.set(x, y + 2.35, z));
    add(new THREE.Mesh(new THREE.TorusGeometry(1.8, 0.11, 8, 24, Math.PI), stone)).position.set(0, y + 4.05, z);
  }
  const heaven = add(glowSprite(0xffe7a0)); heaven.position.set(0, 7.5, -58); heaven.scale.set(14, 14, 1);

  // Le guide : un point de lumière qui devient le lapin, puis la fille penchée
  const mk = (tex) => new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  const guide = add(new THREE.Group());
  const bunny = mk(bunnyTex), girl = mk(girlTex), light = glowSprite(0xffd36b);
  guide.add(bunny, girl, light);
  const bunnyGlow = add(glowSprite(0xfff1c9));

  // Le défilement : la page donne la cible, la caméra la rattrape en douceur
  let target = 0, t = 0, lastScroll = performance.now() / 1000;
  function readScroll() {
    const max = document.documentElement.scrollHeight - innerHeight;
    target = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
    lastScroll = performance.now() / 1000;
    document.getElementById("aide").style.opacity = scrollY > 40 ? 0 : 1;
  }
  addEventListener("scroll", readScroll, { passive: true });

  // Le terrier prend les 40 premiers pour cent du défilement
  const remap = (x) => x < 0.4 ? (x / 0.4) * 0.2 : 0.2 + ((x - 0.4) / 0.6) * 0.8;
  const night = new THREE.Color(0x0e0a14), stage = new THREE.Color(0x1d1626), sky = new THREE.Color(0xfff0c4), bg = new THREE.Color();
  const camPos = new THREE.Vector3(), look = new THREE.Vector3(), dir = new THREE.Vector3(), right = new THREE.Vector3();
  const etape = document.getElementById("etape");
  let idle = 0, runAhead = 0;

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize); resize();

  const clock = new THREE.Clock();
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime, now = performance.now() / 1000;
    t += (target - t) * Math.min(1, dt * 3);
    const tt = remap(t);
    const moving = Math.abs(target - t) > 0.0005 || now - lastScroll < 0.4;

    // Sans défilement : le noir se referme, le lapin part un peu devant puis s'arrête et attend
    idle += ((moving || tt >= 0.2 ? 0 : 1) - idle) * Math.min(1, dt * (moving ? 3 : 0.8));
    runAhead += ((moving ? 0 : 3.2) - runAhead) * Math.min(1, dt * (moving ? 2.5 : 0.7));
    const inBurrow = 1 - S(tt, 0.17, 0.22);

    for (let i = 0; i < N; i++) {
      const zz = tbase[i * 3 + 2], br = R * (1 + Math.sin(time * 0.9 + zz * 0.8) * 0.05);
      tpos[i * 3] = tbase[i * 3] * br; tpos[i * 3 + 1] = tbase[i * 3 + 1] * br + zz * 0.04; tpos[i * 3 + 2] = zz;
    }
    tgeo.attributes.position.needsUpdate = true;
    tmat.opacity = 0.35 * (1 - idle);
    objs.forEach((o) => {
      const d = o.userData, ph = (time * d.v + d.off) % 4;
      o.position.set(d.x + Math.sin(time + d.off) * 0.15, -1.9 + ph, d.z);
      o.material.rotation += d.rot * 0.02;
      o.material.opacity = 0.75 * inBurrow * (1 - idle) * Math.min(1, ph, 4 - ph);
    });

    if (tt < 0.2) { const k = S(tt, 0, 0.2); camPos.set(0, 0.2 - k * 0.5, 2 - k * 14); look.set(0, camPos.y - 0.2, camPos.z - 5); }
    else if (tt < 0.45) { const k = S(tt, 0.2, 0.3); camPos.set(0, -0.3 + k * 0.3, -12 - k * 2.5 - S(tt, 0.38, 0.45) * 0.5); look.set(0, 0.6 + k * 0.6, -20); }
    else {
      const k = S(tt, 0.45, 1), z = -15 - k * 41;
      camPos.set(0, Math.min(Math.max(0, -z - 21) * (0.65 / 3), 6.2) + 0.3, z);
      look.set(0, camPos.y + 0.4 + k * 1.6, z - 5);
    }
    camera.position.copy(camPos); camera.position.y += Math.sin(time * 1.4) * 0.02; camera.lookAt(look);
    lamp.position.copy(camera.position).add(new THREE.Vector3(0, 0.6, -1.5));
    hemi.intensity = 0.9 * S(tt, 0.16, 0.26) + 0.05;

    const open = S(tt, 0.385, 0.45);
    hinges[0].rotation.y = -open * 1.9; hinges[1].rotation.y = open * 1.9;
    const flash = Math.max(0, 1 - Math.abs(tt - 0.37) / 0.025);
    doorGlow.material.opacity = flash + open * 0.5; const ds = 1.5 + flash * 2.5 + open; doorGlow.scale.set(ds, ds * 1.6, 1);
    heaven.material.opacity = 0.4 + S(tt, 0.6, 1) * 0.6;

    camera.getWorldDirection(dir); right.crossVectors(dir, camera.up).normalize();
    const front = camera.position.clone().addScaledVector(dir, 2.4).addScaledVector(right, 0.35); front.y += -0.3 + Math.sin(time * 2.2) * 0.04;
    // Au tout début, ce n'est qu'un point de lumière ; il prend la forme du lapin
    const shape = S(tt, 0.01, 0.06);
    if (tt < 0.3) {
      guide.position.copy(front);
      if (tt < 0.2) guide.position.addScaledVector(dir, 0.8 + runAhead + (moving ? Math.abs(Math.sin(time * 6)) * 0.15 : 0));
      bunny.material.opacity = shape; girl.material.opacity = 0; light.material.opacity = 0;
    } else if (tt < 0.385) {
      const k = S(tt, 0.3, 0.375), hop = Math.abs(Math.sin(k * Math.PI * 4)) * 0.35 * (1 - k);
      guide.position.lerpVectors(front, new THREE.Vector3(0, -1.0, -19.5), k); guide.position.y += hop;
      bunny.material.opacity = 1 - S(tt, 0.365, 0.385); girl.material.opacity = 0; light.material.opacity = 0;
    } else if (tt < 0.46) {
      guide.position.set(0, -0.95, -19.9); bunny.material.opacity = 0;
      girl.material.opacity = light.material.opacity = S(tt, 0.39, 0.44);
    } else {
      guide.position.lerpVectors(new THREE.Vector3(0, -0.95, -19.9), front, S(tt, 0.46, 0.5));
      bunny.material.opacity = 0; girl.material.opacity = light.material.opacity = 1;
    }
    const ls = light.material.opacity * (0.08 + Math.max(0, tt - 0.38) * 0.7) * (1 + Math.sin(time * 3) * 0.08);
    light.scale.set(ls, ls, 1); light.position.set(0.02, -0.05, 0.01);
    const sc = tt < 0.46 && tt > 0.3 ? 1.2 : 1;
    bunny.scale.set(0.5 * sc * (0.3 + 0.7 * shape), 0.62 * sc * (0.3 + 0.7 * shape), 1); girl.scale.set(0.5 * sc, 0.62 * sc, 1);
    bunnyGlow.position.copy(guide.position); bunnyGlow.position.y -= 0.05;
    const point = 1 - shape, bgs = (bunny.material.opacity + point) * (0.9 + Math.sin(time * 2.5) * 0.1);
    bunnyGlow.scale.set(bgs * (point ? 1 : 1.2), bgs * (point ? 1 : 1.2), 1);
    bunnyGlow.material.opacity = Math.min(1, bunny.material.opacity * 0.7 + point);

    bg.copy(stage).lerp(night, inBurrow).lerp(sky, S(tt, 0.45, 1) * 0.9);
    scene.background = bg;
    etape.textContent = tt < 0.2 ? "le terrier" : tt < 0.3 ? "le château" : tt < 0.45 ? "la porte" : tt < 0.9 ? "la montée" : "le cœur";

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  readScroll(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
